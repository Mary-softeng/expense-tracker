{% extends "base.html" %}

{% block content %}
<h2 class="mb-4"><i class="bi bi-plus-circle"></i> Add Expense</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="category_id" class="form-label">Category</label>
                        <select class="form-select" id="category_id" name="category_id" required>
                            {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="item_name" class="form-label">Item Name</label>
                        <input type="text" class="form-control" id="item_name" name="item_name" required placeholder="e.g., Matatu, Milk, Salon">
                    </div>
                    
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (KSH)</label>
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" required placeholder="0.00">
                    </div>
                    
                    <div class="mb-3">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="number" class="form-control" id="quantity" name="quantity" value="1" min="1">
                    </div>
                    
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date" name="date" value="{{ now.strftime('%Y-%m-%d') if now else '' }}">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-plus-circle"></i> Add Expense
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-lightning"></i> Quick Add
            </div>
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-6">
                        <button class="btn btn-outline-primary w-100" onclick="quickAdd('Fare', 'Matatu', 50)">
                            🚌 Matatu 50
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-primary w-100" onclick="quickAdd('Groceries', 'Milk', 150)">
                            🥛 Milk 150
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-primary w-100" onclick="quickAdd('Groceries', 'Eggs', 80)">
                            🥚 Eggs 80
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-primary w-100" onclick="quickAdd('Groceries', 'Tomatoes', 100)">
                            🍅 Tomatoes 100
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-primary w-100" onclick="quickAdd('Groceries', 'Meat', 400)">
                            🥩 Meat 400
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-primary w-100" onclick="quickAdd('Groceries', 'Onions', 50)">
                            🧅 Onions 50
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-primary w-100" onclick="quickAdd('Cosmetics', 'Salon', 500)">
                            💇 Salon 500
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-primary w-100" onclick="quickAdd('Entertainment', 'Movie', 300)">
                            🎬 Movie 300
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-header">
                <i class="bi bi-info-circle"></i> Tips
            </div>
            <div class="card-body">
                <ul class="list-unstyled">
                    <li><i class="bi bi-check-circle text-success"></i> Enter daily expenses as they occur</li>
                    <li><i class="bi bi-check-circle text-success"></i> Use quantity for multiple items</li>
                    <li><i class="bi bi-check-circle text-success"></i> Track all categories to see complete picture</li>
                    <li><i class="bi bi-check-circle text-success"></i> Quick add saves time for common items</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
function quickAdd(category, item, amount) {
    // Get category ID from dropdown
    const select = document.getElementById('category_id');
    const options = select.options;
    let categoryId = null;
    
    for (let i = 0; i < options.length; i++) {
        if (options[i].text === category) {
            categoryId = options[i].value;
            break;
        }
    }
    
    if (categoryId) {
        select.value = categoryId;
        document.getElementById('item_name').value = item;
        document.getElementById('amount').value = amount;
        document.getElementById('quantity').value = 1;
        
        // Auto-submit
        document.querySelector('form').submit();
    } else {
        alert('Category not found! Please add the category first.');
    }
}
</script>
{% endblock %}
