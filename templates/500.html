{% extends "base.html" %}

{% block content %}
<div class="text-center mt-5 pt-5">
    <div class="display-1 text-danger">500</div>
    <i class="bi bi-exclamation-triangle display-3 text-danger d-block mb-3"></i>
    <h1 class="h3 mb-3">Something Went Wrong!</h1>
    <p class="text-muted mb-4">We're sorry for the inconvenience. Please try again later.</p>
    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="bi bi-house"></i> Go Home
        </a>
        <a href="javascript:location.reload()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-clockwise"></i> Retry
        </a>
    </div>
</div>
{% endblock %}
